[simulation]
  name    = "conduction_RC"
  engine  = "srpic"
  runtime = 4000.0     # = 800 / Omega_e0  (Omega_e0^-1 = larmor0 = 5 code units)

[grid]
  # 2D box in units of the hot-side electron Larmor radius rho_e0h.
  # Roberg-Clark et al. 2018 baseline: Lx = L0 = 82 rho_e0h, Ly = 20 rho_e0h
  # (Lx variants L0/2, L0, 2L0). Resolution gives ~40 cells/rho_e0h, d_e ~ 5 cells.
  # NB: ~1.5e9 particles/species here; scale box/ppc down for quick tests.
  resolution = [3280, 800]
  extent     = [[0.0, 82.0], [0.0, 20.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    # x: thermal reservoirs. Fields use CONDUCTOR (closest to the paper's
    # F_y=0, dF_x/dx=dF_z/dx=0); particle re-injection from f_h/f_c is done in
    # the pgen via CustomParticleUpdate. y: periodic.
    fields    = [["CONDUCTOR"], ["PERIODIC"]]
    particles = [["REFLECT"], ["PERIODIC"]]

[scales]
  # extent is in units of rho_e0h (box = 82 x 20 rho_e0h):
  #   larmor0    = 1/v_Th = 1/sqrt(2*T_hot)  -> rho_e0h = 1 code unit (~40 cells)
  #   larmor0/skindepth0 = omega_pe/Omega_e  -> sets beta_e0h = 2*T_hot*(larmor0/skindepth0)^2
  # T_hot = 0.02, omega_pe/Omega_e = larmor0/skindepth0 = 40 -> beta_e0h = 64.
  # d_e = skindepth0 = rho_e0h/sqrt(beta) (~5 cells); v_Th = 0.2 c (nonrelativistic).
  larmor0    = 5.0
  skindepth0 = 0.125

[algorithms]
  current_filters = 8

  [algorithms.timestep]
    CFL = 0.7071

[particles]
  ppc0 = 560.0

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 2e9

  [[particles.species]]
    label    = "p+"
    mass     = 1836.0
    charge   = 1.0
    maxnpart = 2e9
    pusher   = "None"   # stationary neutralizing background

[setup]
  T_hot             = 0.02   # hot-reservoir electron temperature [kB T / (m_e c^2)]; v_Th = 0.2 c
  temperature_ratio = 2.0    # T_hot / T_cold (paper baseline 2; variant 4)
  T_ions            = 0.02   # ions immobile, value irrelevant to the dynamics

[output]
  interval_time = 40.0
  format        = "BPFile"

  [output.fields]
    quantities = ["N", "B", "E", "T00"]
    custom     = ["Qx", "Qy", "Qz"]   # electron heat flux (1/2) m <v_i v^2>; Qx = q_|| along B0

  [output.particles]
    enable = true
    stride = 10

  [output.spectra]
    enable = false

[diagnostics]
  log_level = "WARNING"
  blocking_timers = true

[checkpoint]
  interval = 1000
  keep = 1
