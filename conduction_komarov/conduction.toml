[simulation]
  name    = "_conduction"
  engine  = "srpic"
  runtime = 1000.0

[grid]
  resolution = [2560, 512]
  extent     = [[0.0, 125.0], [0.0, 25.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields = [["MATCH", "MATCH"], ["PERIODIC"]]
    particles = [["PERIODIC", "PERIODIC"], ["PERIODIC"]]

    # absorbing layer for the fields: damps whistlers toward B0 before they reach
    # the reflecting wall. ~9.4 code units ~= 9.4 rho_e1 ~= 192 cells, matching the
    # buffer L_D of Komarov et al. 2018 (default would be only min_extent*0.01 ~= 5 cells).
    [grid.boundaries.match]
      ds = 9.4

[scales]
  # extent is in units of the hot-side electron Larmor radius rho_e1 (box = 125 x 25 rho_e1).
  # larmor0    = 1/v_th1 = 1/sqrt(T_hot)  -> rho_e1 = 1 code unit (~20 cells, as in the paper)
  # skindepth0 = sqrt(2/beta_e)           -> sets the plasma beta (beta_e = 2*n*T/B0^2)
  # current values: T_hot = temperature*temperature_gradient = 0.2, beta_e = 15.
  # to scan beta at fixed box: keep larmor0, set skindepth0 = larmor0*sqrt(0.4/beta_e)
  #   beta_e = 10 -> 0.447, 15 -> 0.365, 25 -> 0.283, 40 -> 0.224
  larmor0    = 2.24
  skindepth0 = 0.365

[algorithms]
  current_filters = 8

  [algorithms.timestep]
    CFL = 0.7071

[particles]
  ppc0 = 400.0
  spatial_sorting_interval = 8

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 2e8

  [[particles.species]]
    label    = "p+"
    mass     = 1836.0
    charge   = 1.0
    maxnpart = 2e8
    pusher = "None"

[setup]
  temperature = 0.1      # cold-side electron temperature [kB T / (m_e c^2)]; T_hot = temperature*temperature_gradient
  temperature_gradient = 2.0    # T_hot / T_cold = T1/T2 (paper fiducial 2; scan {1.5, 2, 3})
  reservoir_width = 9.4         # width of the flat-T0 reservoirs in the initial profile only

[output]
  interval_time = 10.0
  format        = "BPFile"
  
  [output.fields]
    quantities = ["N", "B", "E", "T00"]
    custom     = ["Qx", "Qy", "Qz"]   # electron heat flux (1/2) m <v_i v^2>; Qx = q_|| along B0
  [output.fields.smoothing]
    order = 2

  [output.particles]
    enable = true
    stride = 10 

  [output.spectra]
    enable = false

[diagnostics]
  log_level = "WARNING"
  blocking_timers = true

[checkpoint]
  interval = 1000
  keep = 1